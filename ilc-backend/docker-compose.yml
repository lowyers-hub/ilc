services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ilc
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ilc
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_change_me
      JWT_EXPIRES_IN: 15m
      MIDTRANS_SERVER_KEY: dev_midtrans_server_key
      MIDTRANS_IS_PRODUCTION: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      S3_BUCKET: ${S3_BUCKET:-ilc-dev-bucket}
    depends_on:
      - db
      - redis

volumes:
  db_data:

